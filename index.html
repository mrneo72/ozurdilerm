<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Özür Dilerim...</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            overflow: hidden;
            touch-action: manipulation;
        }
        .card {
            background: #ffffff;
            padding: 32px 22px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(214, 51, 132, 0.15);
            width: 100%;
            max-width: 360px;
            position: relative;
            z-index: 1;
        }
        .emoji {
            font-size: 4.5rem;
            margin-bottom: 10px;
            display: block;
        }
        h1 {
            color: #c9184a;
            font-size: 1.75rem;
            margin: 0 0 12px 0;
            line-height: 1.2;
        }
        p {
            color: #590d22;
            font-size: 1.05rem;
            line-height: 1.5;
            margin: 0 0 28px 0;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        button {
            width: 100%;
            max-width: 240px;
            padding: 15px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        #yesBtn {
            background-color: #2b9348;
            color: white;
            box-shadow: 0 6px 20px rgba(43, 147, 72, 0.35);
            position: relative;
            z-index: 10;
        }
        #noBtn {
            background-color: #e63946;
            color: white;
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.25);
            z-index: 9999;
        }
        #celebration {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .heart {
            font-size: 5rem;
            animation: beat 0.9s infinite;
            margin-bottom: 15px;
        }
        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }
    </style>
</head>
<body>

    <div class="card" id="mainContent">
        <span class="emoji" id="emoji">🥺</span>
        <h1 id="title">Çok Özür Dilerim!</h1>
        <p id="message">Seni kırdığım için gerçekten çok pişmanım. Telafi etmek için her şeyi yapmaya hazırım. Beni affeder misin?</p>
        
        <div class="buttons">
            <button id="yesBtn" onclick="affedildi()">evet affettim ❤️</button>
            <button id="noBtn">Hayır</button>
        </div>
    </div>

    <div class="card" id="celebration">
        <div class="heart">❤️</div>
        <h1>YUUPİİİİ çok teşekkür ederimmm</h1>
        <p>söz veriyorum bir daha seni üzmeyeceğimm iyi ki varsın</p>
    </div>

    <script>
        let yesScale = 1;
        let kacmaSayisi = 0;
        let tasindiMi = false;

        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const emoji = document.getElementById('emoji');

        const uzgunMesajlar = [
            "emin misin? 🥺",
            "bir daha düşün...",
            "gerçekten mi? 😢",
            "llütfen affet ",
            "NOLLUUUUUURRRRRR 💔"
        ];

        function kac(e) {
            if (e) e.preventDefault();

            // İlk dokunuşta butonu kartın içinden çıkarıp doğrudan ekrana (body) al
            if (!tasindiMi) {
                document.body.appendChild(noBtn);
                tasindiMi = true;
            }

            // Metni önce güncelle ki yeni genişliğe göre koordinat hesaplansın
            noBtn.innerText = uzgunMesajlar[kacmaSayisi % uzgunMesajlar.length];
            noBtn.style.position = 'fixed';
            noBtn.style.width = 'auto';
            noBtn.style.maxWidth = 'none';

            // Ekran sınırları içinde kesin güvenli alan hesapla
            const padding = 24;
            const ekranGenislik = document.documentElement.clientWidth;
            const ekranYukseklik = document.documentElement.clientHeight;
            
            const maxX = Math.max(padding, ekranGenislik - noBtn.offsetWidth - padding);
            const maxY = Math.max(padding, ekranYukseklik - noBtn.offsetHeight - padding);

            const randomX = Math.floor(Math.random() * (maxX - padding + 1)) + padding;
            const randomY = Math.floor(Math.random() * (maxY - padding + 1)) + padding;

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;

            emoji.innerText = "😭";
            kacmaSayisi++;

            // Evet butonunu büyüt (ekrandan taşmaması için maksimum 2.4 kat)
            if (yesScale < 2.4) {
                yesScale += 0.2;
                yesBtn.style.transform = `scale(${yesScale})`;
            }
        }

        noBtn.addEventListener('touchstart', kac, { passive: false });
        noBtn.addEventListener('click', kac);

        function affedildi() {
            noBtn.style.display = 'none';
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('celebration').style.display = 'flex';
        }
    </script>

</body>
</html>
